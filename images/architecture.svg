<svg viewBox="0 0 960 610" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0B5FA5"/>
    </marker>
    <marker id="arrowL" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrowGrey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="610" rx="14" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0B5FA5">Wazuh SOC Home Lab — Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#5A6773">Single-VM design · Windows host monitored via agent · contained host-only network</text>

  <!-- Internet / NAT -->
  <rect x="392" y="74" width="176" height="42" rx="21" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="480" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Internet</text>
  <text x="480" y="109" text-anchor="middle" font-size="10.5" fill="#5A6773">NAT adapter — downloads only</text>
  <line x1="600" y1="116" x2="700" y2="150" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowGrey)"/>

  <!-- ===== Windows Host box ===== -->
  <rect x="36" y="140" width="356" height="392" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <rect x="36" y="140" width="356" height="40" rx="12" fill="#475569"/>
  <rect x="36" y="164" width="356" height="16" fill="#475569"/>
  <text x="214" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">WINDOWS 11 HOST</text>
  <text x="214" y="176" text-anchor="middle" font-size="0" fill="#FFFFFF"> </text>
  <text x="214" y="195" text-anchor="middle" font-size="10.5" fill="#64748B">Physical laptop · 16 GB RAM · monitored endpoint</text>

  <!-- host components -->
  <g>
    <rect x="56" y="210" width="316" height="66" rx="8" fill="#EFF4FA" stroke="#B7C6D8"/>
    <text x="72" y="234" font-size="13" font-weight="700" fill="#1F2933">Wazuh Agent (id 001)</text>
    <text x="72" y="255" font-size="11" fill="#5A6773">Collects Windows Event Logs · ships to manager</text>

    <rect x="56" y="286" width="316" height="66" rx="8" fill="#EFF4FA" stroke="#B7C6D8"/>
    <text x="72" y="310" font-size="13" font-weight="700" fill="#1F2933">Sysmon</text>
    <text x="72" y="331" font-size="11" fill="#5A6773">SwiftOnSecurity config · process + cmdline telemetry</text>

    <rect x="56" y="362" width="316" height="66" rx="8" fill="#EFF4FA" stroke="#B7C6D8"/>
    <text x="72" y="386" font-size="13" font-weight="700" fill="#1F2933">File Integrity Monitoring</text>
    <text x="72" y="407" font-size="11" fill="#5A6773">Real-time watch on C:\test (add / modify / delete)</text>

    <rect x="56" y="438" width="316" height="66" rx="8" fill="#F4FAF4" stroke="#B7D8B7"/>
    <text x="72" y="462" font-size="13" font-weight="700" fill="#1F2933">Web Browser</text>
    <text x="72" y="483" font-size="11" fill="#5A6773">Analyst view of the dashboard (HTTPS)</text>
  </g>

  <!-- ===== Ubuntu VM box ===== -->
  <rect x="568" y="140" width="356" height="392" rx="12" fill="#FFFFFF" stroke="#0B5FA5" stroke-width="1.5"/>
  <rect x="568" y="140" width="356" height="40" rx="12" fill="#0B5FA5"/>
  <rect x="568" y="164" width="356" height="16" fill="#0B5FA5"/>
  <text x="746" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">UBUNTU SERVER 24.04 VM</text>
  <text x="746" y="195" text-anchor="middle" font-size="10.5" fill="#64748B">VirtualBox · 8 GB RAM · 2 vCPU · Wazuh 4.14</text>

  <!-- vm components -->
  <g>
    <rect x="588" y="210" width="316" height="86" rx="8" fill="#E9F1F9" stroke="#9DBBDA"/>
    <text x="604" y="234" font-size="13" font-weight="700" fill="#0B5FA5">Wazuh Manager</text>
    <text x="604" y="255" font-size="11" fill="#5A6773">Decoders + rules → evaluates events, raises alerts</text>
    <text x="604" y="274" font-size="11" fill="#5A6773">Custom rule 100100 · FP tune 100200</text>

    <rect x="588" y="306" width="316" height="86" rx="8" fill="#E9F1F9" stroke="#9DBBDA"/>
    <text x="604" y="330" font-size="13" font-weight="700" fill="#0B5FA5">Wazuh Indexer</text>
    <text x="604" y="351" font-size="11" fill="#5A6773">OpenSearch · stores &amp; indexes alerts</text>
    <text x="604" y="370" font-size="11" fill="#5A6773">Searchable alert history</text>

    <rect x="588" y="402" width="316" height="86" rx="8" fill="#E9F1F9" stroke="#9DBBDA"/>
    <text x="604" y="426" font-size="13" font-weight="700" fill="#0B5FA5">Wazuh Dashboard</text>
    <text x="604" y="447" font-size="11" fill="#5A6773">Web UI · triage, hunting, MITRE ATT&amp;CK views</text>
    <text x="604" y="466" font-size="11" fill="#5A6773">HTTPS on port 443</text>
  </g>

  <!-- ===== middle: host-only network ===== -->
  <text x="480" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">HOST-ONLY</text>
  <text x="480" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">NETWORK</text>
  <text x="480" y="347" text-anchor="middle" font-size="10.5" fill="#5A6773">192.168.56.0/24</text>

  <!-- top arrow: agent -> manager -->
  <line x1="392" y1="238" x2="568" y2="238" stroke="#0B5FA5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="228" text-anchor="middle" font-size="10.5" fill="#0B5FA5">events (logs + Sysmon + FIM)</text>
  <text x="480" y="253" text-anchor="middle" font-size="10" fill="#5A6773">TCP 1514 · enroll 1515</text>

  <!-- bottom arrow: dashboard -> browser -->
  <line x1="568" y1="460" x2="392" y2="460" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowL)"/>
  <text x="480" y="450" text-anchor="middle" font-size="10.5" fill="#2E7D32">dashboard UI</text>
  <text x="480" y="475" text-anchor="middle" font-size="10" fill="#5A6773">HTTPS 443</text>

  <!-- ===== data flow strip ===== -->
  <rect x="36" y="552" width="888" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="52" y="579" font-size="11.5" fill="#334155">
    <tspan font-weight="700" fill="#0B5FA5">Flow:</tspan>
    <tspan dx="6">1 collect endpoint telemetry</tspan>
    <tspan dx="6" fill="#94A3B8">›</tspan>
    <tspan dx="6">2 agent → manager (encrypted)</tspan>
    <tspan dx="6" fill="#94A3B8">›</tspan>
    <tspan dx="6">3 manager runs rules (incl. custom)</tspan>
    <tspan dx="6" fill="#94A3B8">›</tspan>
    <tspan dx="6">4 alerts indexed</tspan>
    <tspan dx="6" fill="#94A3B8">›</tspan>
    <tspan dx="6">5 analyst triages in dashboard</tspan>
  </text>
</svg>
